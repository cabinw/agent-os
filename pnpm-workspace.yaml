packages:
  - "packages/*"
  - "apps/*"

# Both need their install script to fetch a platform-native binary; neither
# works without it. Reviewed and approved deliberately — pnpm blocks install
# scripts by default, and that default should stay on for anything added later.
allowBuilds:
  "@biomejs/biome": true
  better-sqlite3: true
  esbuild: true

minimumReleaseAgeExclude:
  - '@types/react-dom@19.2.5'
