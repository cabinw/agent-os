<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Agent OS — 智能体</title>
<!--
  The Agent Hub surface.

  Built to docs/design/design-language.md rather than as spike chrome, because
  this doubles as a working draft of Phase 3.4's Agents destination: the sidebar
  shows the real seven, the roster is the real roster, and the thread is the
  real reducer's projection — imported from /src/thread.mjs, never reimplemented.

  Three things it exists to make visible:
    · who is awake, who is busy, and who can call our tools at all
    · that a message from one agent to another is what wakes the second
    · how deep a causal chain has run against its budget

  Messages are all left-aligned, the human's included. This is a team's
  transcript; right-aligning the person would suggest they are one side of a
  two-party chat, and they are not.
-->
<style>
  :root {
    --bg: #F7F8FA;
    --surface: #FFFFFF;
    --border: #E8EAED;
    --text: #111827;
    --text-muted: #6B7280;
    --accent: #6366F1;
    --accent-2: #8B5CF6;
    --ok: #10B981;
    --warn: #F59E0B;
    --risk: #EF4444;
    --radius-card: 12px;
    --radius-ctl: 8px;
    --radius-chip: 6px;
    --shadow-card: 0 1px 2px rgba(0, 0, 0, .04);
    color-scheme: light;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 400 13px/1.55 -apple-system, BlinkMacSystemFont, "SF Pro Text",
      "PingFang SC", "Helvetica Neue", Arial, sans-serif;
    font-variant-numeric: tabular-nums;
    height: 100vh;
    display: grid;
    grid-template-columns: 220px 268px 1fr;
  }

  /* ---------------------------------------------------------------- sidebar */
  .side {
    background: var(--surface);
    border-right: 1px solid var(--border);
    padding: 16px 12px;
    display: flex;
    flex-direction: column;
    gap: 2px;
  }
  .brand {
    display: flex; align-items: center; gap: 8px;
    padding: 4px 8px 16px;
    font-weight: 600; font-size: 14px;
  }
  .mark {
    width: 22px; height: 22px; border-radius: 7px;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    display: grid; place-items: center;
    color: #fff; font-size: 12px;
  }
  .nav {
    display: flex; align-items: center; gap: 9px;
    padding: 7px 8px; border-radius: var(--radius-ctl);
    color: var(--text-muted); font-size: 13px;
  }
  .nav .ico { width: 16px; text-align: center; opacity: .75; }
  .nav.on {
    background: linear-gradient(135deg, rgba(99,102,241,.10), rgba(139,92,246,.10));
    color: var(--accent); font-weight: 600;
  }
  .nav.off { opacity: .42; }
  .side-foot {
    margin-top: auto; padding: 10px 8px 0;
    border-top: 1px solid var(--border);
    font-size: 12px; color: var(--text-muted);
  }

  /* ----------------------------------------------------------------- roster */
  .roster { border-right: 1px solid var(--border); overflow-y: auto; padding: 16px 14px; }
  .sect { font-size: 15px; font-weight: 600; margin: 0 0 4px; }
  .sect-sub { font-size: 12px; color: var(--text-muted); margin: 0 0 14px; }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-card);
    box-shadow: var(--shadow-card);
    padding: 12px 14px;
    margin-bottom: 10px;
    cursor: pointer;
    transition: border-color 120ms ease-out;
  }
  .card[aria-selected="true"] { border-color: var(--accent); }
  .card-hd { display: flex; align-items: center; gap: 9px; }
  .av {
    width: 26px; height: 26px; border-radius: 8px; flex: none;
    display: grid; place-items: center;
    font-size: 11px; font-weight: 650; color: #fff;
  }
  .who { font-weight: 600; font-size: 14px; }
  .role { font-size: 12px; color: var(--text-muted); }
  .pulse {
    margin-left: auto; width: 7px; height: 7px; border-radius: 50%;
    background: var(--border); flex: none;
  }
  .pulse.busy { background: var(--warn); animation: breathe 1.6s ease-in-out infinite; }
  .pulse.live { background: var(--ok); }
  @keyframes breathe { 0%, 100% { opacity: 1 } 50% { opacity: .35 } }

  .chips { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 9px; }
  .chip {
    font-size: 12px; padding: 1px 7px;
    border-radius: var(--radius-chip);
    background: var(--bg); color: var(--text-muted);
    border: 1px solid var(--border);
  }
  .chip.cap { background: rgba(99,102,241,.07); color: var(--accent); border-color: rgba(99,102,241,.18); }
  .chip.no { color: var(--risk); border-color: rgba(239,68,68,.22); background: rgba(239,68,68,.05); }

  /* ----------------------------------------------------------------- thread */
  .main { display: flex; flex-direction: column; min-width: 0; }
  .top {
    height: 52px; flex: none;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
    display: flex; align-items: center; gap: 14px;
    padding: 0 20px;
  }
  .top h1 { font-size: 15px; font-weight: 600; margin: 0; }
  .meter { margin-left: auto; display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--text-muted); }
  .bar { width: 84px; height: 5px; border-radius: 3px; background: var(--border); overflow: hidden; }
  .bar > i { display: block; height: 0%; width: 0; background: var(--ok); transition: width 400ms ease-in-out, background 400ms; height: 100%; }

  .feed { flex: 1; overflow-y: auto; padding: 20px 24px 8px; }
  .feed-inner { max-width: 820px; }

  /* Indentation is the hop count. A delegation chain that renders flat looks
     like four people talking; stepped, it reads as one request being handed
     down and answered back — which is what the budget in the header counts. */
  .row {
    display: flex; gap: 11px; padding: 9px 0;
    margin-left: calc(var(--d, 0) * 18px);
    animation: arrive 200ms ease-out;
  }
  @keyframes arrive { from { opacity: 0; transform: translateY(8px) } to { opacity: 1; transform: none } }
  .rail { width: 0; border-left: 2px solid transparent; margin-right: -4px; }
  .row:not([data-depth="0"]) .rail { border-color: rgba(99,102,241,.16); }
  .body { min-width: 0; flex: 1; }
  .line { display: flex; align-items: baseline; gap: 7px; flex-wrap: wrap; }
  .name { font-weight: 600; font-size: 13px; }
  .to { font-size: 12px; color: var(--text-muted); }
  .to b { color: var(--accent); font-weight: 600; }
  .meta { font-size: 12px; color: var(--text-muted); }
  .text { margin-top: 3px; white-space: pre-wrap; word-break: break-word; }

  .row.human .body {
    border-left: 2px solid var(--accent);
    padding-left: 11px; margin-left: -2px;
  }
  .row.system .text { color: var(--warn); }

  .tag { font-size: 12px; padding: 0 6px; border-radius: var(--radius-chip); border: 1px solid transparent; }
  .tag.delegate { color: var(--accent); background: rgba(99,102,241,.08); border-color: rgba(99,102,241,.18); }
  .tag.warn { color: var(--warn); background: rgba(245,158,11,.09); border-color: rgba(245,158,11,.2); }

  /* Thread switcher. ADR-006: one thread per task, plus the project thread for
     anything not scoped to one. Filtering, not a second grouping rule. */
  .tabs { display: flex; gap: 6px; overflow-x: auto; padding: 0 20px; height: 42px;
    align-items: center; border-bottom: 1px solid var(--border); background: var(--surface); flex: none; }
  .tab {
    display: flex; align-items: center; gap: 6px; flex: none;
    border: 1px solid var(--border); background: var(--surface);
    border-radius: 999px; padding: 3px 11px; font: inherit; font-size: 12px;
    color: var(--text-muted); cursor: pointer; white-space: nowrap;
    transition: all 120ms ease-out;
  }
  .tab[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); background: rgba(99,102,241,.07); font-weight: 600; }
  .st { width: 6px; height: 6px; border-radius: 50%; background: var(--border); flex: none; }
  .st.assigned, .st.created { background: var(--text-muted); }
  .st.running { background: var(--info); }
  .st.review { background: var(--warn); }
  .st.completed { background: var(--ok); }
  .st.failed, .st.cancelled { background: var(--risk); }

  .banner {
    display: flex; align-items: center; gap: 12px;
    margin: 4px 0 10px; padding: 11px 14px;
    background: var(--surface); border: 1px solid var(--border);
    border-left: 3px solid var(--warn);
    border-radius: var(--radius-card); box-shadow: var(--shadow-card);
  }
  .banner .grow { flex: 1; min-width: 0; }
  .banner b { font-size: 13px; }
  .btn {
    border: 1px solid var(--border); background: var(--surface); color: var(--text);
    border-radius: var(--radius-ctl); padding: 6px 13px; font: 600 12px/1 inherit; cursor: pointer;
    transition: all 120ms ease-out;
  }
  .btn.ok { border-color: var(--ok); color: var(--ok); }
  .btn.ok:hover { background: rgba(16,185,129,.07); }
  .btn.no:hover { background: rgba(239,68,68,.06); color: var(--risk); border-color: var(--risk); }

  .life { display: flex; align-items: center; gap: 8px; color: var(--text-muted); font-size: 12px; padding: 7px 0; }
  .life::before { content: ""; width: 14px; height: 1px; background: var(--border); flex: none; }
  .life .st { margin-right: 2px; }

  .divider {
    display: flex; align-items: center; gap: 10px;
    color: var(--text-muted); font-size: 12px;
    padding: 12px 0;
  }
  .divider::before, .divider::after { content: ""; height: 1px; background: var(--border); flex: 1; }

  details.think { margin-top: 6px; }
  details.think > summary { cursor: pointer; font-size: 12px; color: var(--text-muted); list-style: none; }
  details.think > summary::-webkit-details-marker { display: none; }
  details.think > summary::before { content: "▸ "; }
  details.think[open] > summary::before { content: "▾ "; }
  details.think pre {
    margin: 6px 0 0; padding: 10px 12px;
    background: var(--bg); border: 1px solid var(--border);
    border-radius: var(--radius-ctl);
    font-size: 12px; color: var(--text-muted);
    white-space: pre-wrap; max-height: 220px; overflow: auto;
  }

  .live { color: var(--text-muted); }
  .caret { animation: blink 1s steps(2) infinite; }
  @keyframes blink { 50% { opacity: 0 } }

  /* --------------------------------------------------------------- composer */
  .composer { flex: none; border-top: 1px solid var(--border); background: var(--surface); padding: 12px 24px 16px; }
  .composer-inner { max-width: 820px; }
  .addr { display: flex; align-items: center; gap: 7px; margin-bottom: 8px; font-size: 12px; color: var(--text-muted); flex-wrap: wrap; }
  .pill {
    border: 1px solid var(--border); background: var(--surface);
    border-radius: 999px; padding: 3px 11px; font-size: 12px;
    color: var(--text-muted); cursor: pointer; font-family: inherit;
    transition: all 120ms ease-out;
  }
  .pill[aria-pressed="true"] {
    border-color: var(--accent); color: var(--accent);
    background: rgba(99,102,241,.07); font-weight: 600;
  }
  .box { display: flex; gap: 10px; align-items: flex-end; }
  textarea {
    flex: 1; resize: none; font: inherit; color: inherit;
    border: 1px solid var(--border); border-radius: var(--radius-ctl);
    padding: 9px 12px; min-height: 40px; max-height: 160px;
    background: var(--surface); outline: none;
    transition: border-color 120ms ease-out;
  }
  textarea:focus { border-color: var(--accent); }
  .send {
    border: 0; border-radius: var(--radius-ctl); padding: 10px 18px;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    color: #fff; font: 600 13px/1 inherit; cursor: pointer;
    transition: opacity 120ms ease-out;
  }
  .hint { margin-top: 7px; font-size: 12px; color: var(--text-muted); }

  /* --------------------------------------------------------- authentication */
  [hidden] { display: none !important; }
  .auth-gate {
    position: fixed; inset: 0; z-index: 20;
    display: grid; place-items: center;
    padding: 24px;
    background: rgba(247, 248, 250, .92);
    backdrop-filter: blur(8px);
  }
  .auth-card {
    width: min(380px, 100%);
    padding: 24px;
    border: 1px solid var(--border);
    border-radius: 16px;
    background: var(--surface);
    box-shadow: 0 16px 48px rgba(17, 24, 39, .12);
  }
  .auth-mark {
    width: 34px; height: 34px; margin-bottom: 16px;
    border-radius: 10px;
    display: grid; place-items: center;
    color: #fff; font-weight: 650;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
  }
  .auth-card h1 { margin: 0 0 6px; font-size: 18px; }
  .auth-card p { margin: 0 0 18px; color: var(--text-muted); }
  .auth-card label { display: block; margin-bottom: 6px; font-weight: 600; }
  .auth-row { display: flex; gap: 8px; }
  .auth-row input {
    min-width: 0; flex: 1;
    padding: 9px 11px;
    border: 1px solid var(--border);
    border-radius: var(--radius-ctl);
    font: inherit; outline: none;
  }
  .auth-row input:focus { border-color: var(--accent); }
  .auth-row button {
    border: 0; border-radius: var(--radius-ctl);
    padding: 9px 15px;
    color: #fff; font: 600 13px/1 inherit; cursor: pointer;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
  }
  .auth-error { min-height: 19px; margin-top: 8px; color: var(--risk); font-size: 12px; }
  .auth-note { margin-top: 14px; font-size: 12px; color: var(--text-muted); }
</style>
</head>
<body>

<div class="auth-gate" id="authgate" role="dialog" aria-modal="true" aria-labelledby="auth-title">
  <form class="auth-card" id="authform">
    <div class="auth-mark">◈</div>
    <h1 id="auth-title">连接 Agent OS</h1>
    <p>输入启动 Hub 时显示的人类访问令牌。令牌只保留在当前页面内存中。</p>
    <label for="token">Bearer token</label>
    <div class="auth-row">
      <input id="token" name="token" type="password" autocomplete="off" spellcheck="false" required>
      <button type="submit">连接</button>
    </div>
    <div class="auth-error" id="autherror" role="alert"></div>
    <div class="auth-note">也可以用 <code>#token=…</code> 打开；页面会在连接前立即清除地址栏片段。</div>
  </form>
</div>

<aside class="side" data-protected inert>
  <div class="brand"><span class="mark">◈</span> Agent OS</div>
  <div class="nav off"><span class="ico">▤</span> 项目库</div>
  <div class="nav off"><span class="ico">◎</span> 项目脉搏</div>
  <div class="nav off"><span class="ico">◇</span> 画布</div>
  <div class="nav off"><span class="ico">☰</span> 任务</div>
  <div class="nav on"><span class="ico">◉</span> 智能体</div>
  <div class="nav off"><span class="ico">✦</span> 记忆</div>
  <div class="nav off"><span class="ico">⚙</span> 设置</div>
  <div class="side-foot">
    <div id="logline">— 事件</div>
    <div style="margin-top:4px">你是 Supervisor</div>
  </div>
</aside>

<section class="roster" data-protected inert>
  <h2 class="sect">花名册</h2>
  <p class="sect-sub">点一个人，下面的输入框就发给他</p>
  <div id="cards"></div>
</section>

<main class="main" data-protected inert>
  <header class="top">
    <h1 id="scopeline">全部</h1>
    <span class="meta" id="statusline">连接中…</span>
    <div class="meter">
      <span id="hopnum">0 / 0 跳</span>
      <span class="bar"><i id="hopbar"></i></span>
    </div>
  </header>

  <div class="tabs" id="tabs"></div>
  <div class="feed" id="scroller"><div class="feed-inner">
    <div id="banner"></div>
    <div id="feed"></div>
  </div></div>

  <div class="composer"><div class="composer-inner">
    <div class="addr"><span>发给</span><span id="pills"></span></div>
    <div class="box">
      <textarea id="input" rows="1" placeholder="说点什么…（⌘↵ 发送）"></textarea>
      <button class="send" id="send">发送</button>
    </div>
    <div class="hint" id="hint"></div>
  </div></div>
</main>

<script type="module">
import { reduce } from "/src/thread.mjs";
import { escapeHtml as esc } from "/src/html.mjs";

/**
 * Strings live here rather than inline: the product ships zh-CN and en from the
 * first release (CLAUDE.md), and retrofitting extraction is the expensive way to
 * do it. Only zh-CN is filled in — having one place to add the second is the point.
 */
const STATUS = {
  created: "待指派", assigned: "已指派", running: "进行中", blocked: "阻塞",
  review: "待验收", completed: "已验收", failed: "失败", cancelled: "已取消",
};

const T = {
  projectThread: "项目会话",
  allTasks: "全部",
  accept: "验收通过",
  reject: "打回重做",
  reviewHint: "交付待你验收——agent 只能交付，不能验收自己的活。",
  newTask: "＋ 新任务",
  taskPrompt: "任务标题？（运行时会按能力挑执行者）",
  delegate: "委派",
  budgetStop: "预算停止",
  reasoning: "思考过程",
  replying: "正在回复",
  idle: "空闲",
  disconnected: "已断开",
  tools: "会调工具",
  noTools: "需适配器翻译",
  you: "你",
  hops: (d, b) => `${d} / ${b} 跳`,
  events: (n) => `${n} 事件`,
  thinking: (n) => `${n} 思考中…`,
  hintFor: (a) =>
    !a
      ? ""
      : a.integration.participates
        ? `${a.label} 能直接调 find_agent / send_message——可以让它把活派给别人。`
        : `${a.label} 不会调我们的工具，回复由适配器代发，它无法主动委派。`,
};

const AVATAR = ["#6366F1", "#8B5CF6", "#3B82F6", "#10B981", "#F59E0B"];
const colorOf = (id) => {
  let h = 0;
  for (const ch of id) h = (h * 31 + ch.charCodeAt(0)) % 997;
  return AVATAR[h % AVATAR.length];
};

let thread = { items: [], agents: {} };
let agents = [];
let budget = 6;
let human = "you";
let target = null;
let tasks = {};
/** null = the project thread's own view; "*" = everything. */
let scope = "*";
/** Live-only, never in the log: streaming previews keyed by agent id. */
const streams = new Map();

const $ = (id) => document.getElementById(id);
const protectedSurfaces = [...document.querySelectorAll("[data-protected]")];
let bearer = null;
let connectionVersion = 0;
let eventController = null;

function fragmentToken() {
  const params = new URLSearchParams(location.hash.startsWith("#") ? location.hash.slice(1) : "");
  const token = params.get("token")?.trim() ?? "";
  if (location.hash) {
    // Fragments are not sent in HTTP requests. Remove it before the first
    // authenticated fetch so it cannot survive in screenshots or copied URLs.
    history.replaceState(null, "", `${location.pathname}${location.search}`);
  }
  return token;
}

function lockShell(message = "") {
  for (const surface of protectedSurfaces) surface.setAttribute("inert", "");
  $("authgate").hidden = false;
  $("autherror").textContent = message;
  requestAnimationFrame(() => $("token").focus());
}

function unlockShell() {
  for (const surface of protectedSurfaces) surface.removeAttribute("inert");
  $("authgate").hidden = true;
  $("autherror").textContent = "";
}

function loseAuthentication(message) {
  bearer = null;
  connectionVersion++;
  eventController?.abort();
  eventController = null;
  lockShell(message);
}

function authenticate(token) {
  bearer = token;
  connectionVersion++;
  eventController?.abort();
  $("authgate").hidden = true;
  $("statusline").textContent = "正在验证…";
  connectEvents(connectionVersion);
}

const apiFetch = async (path, init = {}) => {
  if (!bearer) throw new Error("human bearer token required");
  const headers = new Headers(init.headers);
  headers.set("authorization", `Bearer ${bearer}`);
  const response = await fetch(path, { ...init, headers });
  if (response.status === 401 || response.status === 403) {
    loseAuthentication("令牌无效或不是 human 凭据，请重新输入。");
  }
  return response;
};

$("authform").addEventListener("submit", (event) => {
  event.preventDefault();
  const token = $("token").value.trim();
  $("token").value = "";
  if (token) authenticate(token);
});
const clock = (at) => new Date(at).toLocaleTimeString("zh-CN", { hour12: false });
const nameOf = (id) =>
  id === human ? T.you : (agents.find((a) => a.id === id)?.label ?? id);

// --------------------------------------------------------------------- tasks

function renderTasks() {
  const list = Object.values(tasks);
  $("tabs").innerHTML = [
    `<button class="tab" data-scope="*" aria-pressed="${scope === "*"}">${T.allTasks}</button>`,
    `<button class="tab" data-scope="" aria-pressed="${scope === ""}">${T.projectThread}</button>`,
    ...list.map(
      (t) => `<button class="tab" data-scope="${esc(t.id)}" aria-pressed="${scope === t.id}"
        title="${esc(t.title)}"><span class="st ${t.status}"></span>${esc(t.id)} · ${STATUS[t.status]}</button>`,
    ),
    `<button class="tab" data-new="1">${T.newTask}</button>`,
  ].join("");

  // Acceptance is the human's act, so it is a control on the human's surface —
  // deliberately not reachable through any tool an agent can call (rule 5).
  const pending = list.filter((t) => t.status === "review");
  $("banner").innerHTML = pending
    .map(
      (t) => `<div class="banner">
        <span class="grow"><b>${esc(t.id)} · ${esc(t.title)}</b>
          <div class="meta">${T.reviewHint}</div></span>
        <button class="btn ok" data-accept="${esc(t.id)}">${T.accept}</button>
        <button class="btn no" data-reject="${esc(t.id)}">${T.reject}</button>
      </div>`,
    )
    .join("");
}

// -------------------------------------------------------------------- roster

function renderRoster() {
  $("cards").innerHTML = agents
    .map((a) => {
      const dot = a.busy ? "busy" : a.hasSession ? "live" : "";
      const caps = a.capabilities.map((c) => `<span class="chip cap">${esc(c)}</span>`).join("");
      const part = a.integration.participates
        ? `<span class="chip">${T.tools}</span>`
        : `<span class="chip no">${T.noTools}</span>`;
      return `<div class="card" data-id="${esc(a.id)}" aria-selected="${a.id === target}">
        <div class="card-hd">
          <span class="av" style="background:${colorOf(a.id)}">${esc(a.label[0])}</span>
          <span><span class="who">${esc(a.label)}</span><span class="role"> · ${esc(a.role)}</span></span>
          <span class="pulse ${dot}"></span>
        </div>
        <div class="chips">${caps}${part}</div>
      </div>`;
    })
    .join("");

  $("pills").innerHTML = agents
    .map(
      (a) =>
        `<button class="pill" data-id="${esc(a.id)}" aria-pressed="${a.id === target}">${esc(a.label)}</button>`,
    )
    .join(" ");

  const busy = agents.filter((a) => a.busy);
  $("statusline").textContent = busy.length
    ? T.thinking(busy.map((a) => a.label).join("、"))
    : T.idle;
  $("hint").textContent = T.hintFor(agents.find((a) => a.id === target));
}

document.addEventListener("click", async (e) => {
  const tab = e.target.closest("[data-scope]");
  if (tab) {
    scope = tab.dataset.scope;
    renderTasks();
    renderThread();
    return;
  }
  if (e.target.closest("[data-new]")) {
    const title = prompt(T.taskPrompt);
    if (title) {
      const res = await apiFetch("/task", {
        method: "POST",
        headers: { "content-type": "application/json" },
        body: JSON.stringify({ title }),
      });
      if (!res.ok) $("statusline").textContent = (await res.json()).error;
    }
    return;
  }
  const acc = e.target.closest("[data-accept], [data-reject]");
  if (acc) {
    await apiFetch("/accept", {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({ task: acc.dataset.accept ?? acc.dataset.reject, ok: !!acc.dataset.accept }),
    });
    return;
  }
  const el = e.target.closest("[data-id]");
  if (!el) return;
  target = el.dataset.id;
  renderRoster();
  $("input").focus();
});

// -------------------------------------------------------------------- thread

function renderThread() {
  const deepest = thread.items.reduce((m, i) => Math.max(m, i.depth ?? 0), 0);
  $("scopeline").textContent = scope === "*" ? T.allTasks : scope === "" ? T.projectThread : scope;
  $("hopnum").textContent = T.hops(deepest, budget);
  const bar = $("hopbar");
  bar.style.width = `${Math.min(100, (deepest / budget) * 100)}%`;
  bar.style.background =
    deepest >= budget ? "var(--risk)" : deepest > budget * 0.6 ? "var(--warn)" : "var(--ok)";
  $("logline").textContent = T.events(thread.items.length);

  const shown = thread.items.filter(
    (i) => scope === "*" || i.kind === "divider" || (i.task ?? "") === scope,
  );
  const rows = shown.map((i) => {
    if (i.kind === "divider") return `<div class="divider">${esc(i.label)}</div>`;
    if (i.kind === "lifecycle")
      return `<div class="life"><span class="st ${i.status}"></span>${esc(i.label)}</div>`;
    return messageRow(i);
  });

  for (const [id, s] of streams) {
    if (!s.text && !s.thought) continue;
    rows.push(`<div class="row" data-depth="0"><div class="rail"></div><div class="body">
      <div class="line"><span class="name">${esc(nameOf(id))}</span>
        <span class="meta">${T.replying}</span></div>
      ${s.thought ? `<details class="think"><summary>${T.reasoning}</summary><pre>${esc(s.thought.slice(-1200))}</pre></details>` : ""}
      <div class="text live">${esc(s.text)}<span class="caret">▌</span></div>
    </div></div>`);
  }

  $("feed").innerHTML = rows.join("");
  $("scroller").scrollTop = $("scroller").scrollHeight;
}

function messageRow(i) {
  const isHuman = i.actorKind === "human";
  const isSystem = i.actorKind === "system";
  // The seam, made visible: an agent addressing another agent is exactly the
  // thing the hub exists to prove works.
  const delegated = !isHuman && !isSystem && i.to !== human;

  const depth = i.depth ?? 0;
  return `<div class="row ${isHuman ? "human" : isSystem ? "system" : ""}"
      data-depth="${depth}" style="--d:${Math.min(depth, 6)}">
    <div class="rail"></div>
    <div class="body">
      <div class="line">
        <span class="name">${esc(nameOf(i.from))}</span>
        <span class="to">→ <b>${esc(nameOf(i.to))}</b></span>
        ${delegated ? `<span class="tag delegate">${T.delegate}</span>` : ""}
        ${i.task && scope === "*" ? `<span class="tag">${esc(i.task)}</span>` : ""}
        ${isSystem ? `<span class="tag warn">${T.budgetStop}</span>` : ""}
        <span class="meta">${clock(i.at)}${i.ms ? ` · ${(i.ms / 1000).toFixed(1)}s` : ""}</span>
      </div>
      <div class="text">${esc(i.text)}</div>
    </div>
  </div>`;
}

// ----------------------------------------------------------------- transport

function receive(d) {
  switch (d.type) {
    case "hello":
      thread = d.thread;
      agents = d.agents;
      tasks = d.tasks ?? {};
      budget = d.budget;
      human = d.human;
      target ??= agents.find((a) => a.role === "coordinator")?.id ?? agents[0]?.id;
      renderRoster();
      renderTasks();
      renderThread();
      break;
    case "tasks":
      tasks = d.tasks;
      renderTasks();
      renderThread();
      break;
    case "event":
      // The server's own reducer, one event at a time. `reduce` is pure, so
      // folding here and replaying there cannot disagree.
      thread = reduce(thread, d.event);
      streams.delete(d.event.payload?.from);
      renderThread();
      break;
    case "roster":
      agents = d.agents;
      renderRoster();
      renderThread();
      break;
    case "delta":
    case "thought": {
      const s = streams.get(d.agent) ?? { text: "", thought: "" };
      if (d.type === "delta") s.text += d.text;
      else s.thought += d.text;
      streams.set(d.agent, s);
      renderThread();
      break;
    }
    case "turn":
      streams.delete(d.agent);
      renderThread();
      break;
    case "notice":
      $("statusline").textContent = d.text;
      break;
    case "error":
      $("statusline").textContent = `✗ ${d.message}`;
      break;
  }
}

async function connectEvents(version) {
  while (bearer && version === connectionVersion) {
    try {
      const controller = new AbortController();
      eventController = controller;
      const response = await apiFetch("/events", {
        headers: { accept: "text/event-stream" },
        signal: controller.signal,
      });
      if (!bearer || version !== connectionVersion) return;
      if (!response.ok || !response.body) throw new Error(`HTTP ${response.status}`);
      unlockShell();
      const reader = response.body.pipeThrough(new TextDecoderStream()).getReader();
      let buffer = "";
      for (;;) {
        const { value, done } = await reader.read();
        if (done) break;
        buffer += value;
        for (let end = buffer.indexOf("\n\n"); end >= 0; end = buffer.indexOf("\n\n")) {
          const frame = buffer.slice(0, end);
          buffer = buffer.slice(end + 2);
          const data = frame
            .split("\n")
            .filter((line) => line.startsWith("data:"))
            .map((line) => line.slice(5).trimStart())
            .join("\n");
          if (data) receive(JSON.parse(data));
        }
      }
    } catch {
      if (!bearer || version !== connectionVersion) return;
      $("statusline").textContent = T.disconnected;
    }
    await new Promise((resolve) => setTimeout(resolve, 1000));
  }
}

const initialToken = fragmentToken();
if (initialToken) authenticate(initialToken);
else lockShell();

// ------------------------------------------------------------------ composer

async function send() {
  const text = $("input").value.trim();
  if (!text || !target) return;
  $("input").value = "";
  $("input").style.height = "auto";
  const res = await apiFetch("/say", {
    method: "POST",
    headers: { "content-type": "application/json" },
    body: JSON.stringify({ text, to: target }),
  });
  if (!res.ok) $("statusline").textContent = (await res.json()).error;
}

$("send").addEventListener("click", send);
$("input").addEventListener("keydown", (e) => {
  if (e.key === "Enter" && (e.metaKey || e.ctrlKey)) {
    e.preventDefault();
    send();
  }
});
$("input").addEventListener("input", (e) => {
  e.target.style.height = "auto";
  e.target.style.height = `${Math.min(160, e.target.scrollHeight)}px`;
});
</script>
