# Install as /etc/nginx/conf.d/agent-os-hub-limits.conf before enabling the
# Agent OS virtual host. These shared-memory zones are scoped by name and do not
# apply to any other site unless that site explicitly references them.
limit_conn_zone $binary_remote_addr zone=agent_os_conn:10m;
limit_req_zone $binary_remote_addr zone=agent_os_api:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=agent_os_runner:10m rate=20r/s;
