# Staging example only. Replace every agent-os.example.invalid occurrence with
# the approved dedicated FQDN and certificate path. Do not enable this file
# until nginx -t succeeds and the certificate chain matches that FQDN.
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name agent-os.example.invalid;
    client_max_body_size 1m;
    limit_req_status 429;
    limit_conn_status 429;
    # Maintenance markers are a correctness gate. Never inherit a cached
    # negative stat result from a shared http{} configuration.
    open_file_cache off;

    ssl_certificate /etc/letsencrypt/live/agent-os.example.invalid/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/agent-os.example.invalid/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_tickets off;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # Avoid request-target logging: query strings must never become a bearer
    # transport, but disabling access logs keeps accidental values out too.
    access_log off;
    error_log /var/log/nginx/agent-os-hub-error.log crit;

    if ($host != "agent-os.example.invalid") {
        return 421;
    }
    # The protocol has no query transport. Reject it before routing so bearer
    # material can never be smuggled into a request target or proxy log.
    if ($is_args != "") {
        return 400;
    }

    # Probes are loopback-only. These exact matches run before the proxy.
    location = /health/live {
        return 404;
    }
    location = /health/ready {
        return 404;
    }
    location = /health/quiescent {
        return 404;
    }

    location = /events {
        if (-e /var/lib/agent-os-ops/hub-block) {
            return 503;
        }
        if (-e /run/agent-os/hub-maintenance-hard) {
            return 503;
        }
        if (-e /run/agent-os/hub-maintenance) {
            return 503;
        }
        limit_conn agent_os_conn 5;
        limit_req zone=agent_os_api burst=10 nodelay;
        proxy_pass http://127.0.0.1:4173;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Origin $http_origin;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    location ^~ /runner/v1/ {
        # Normal promotion maintenance blocks new Worker polls as well as
        # human/Agent ingress. The Worker reconnects only after exact liveness,
        # pointer history and service enablement are all signed off. The hard
        # sentinel remains the stop condition for incomplete recovery.
        if (-e /var/lib/agent-os-ops/hub-block) {
            return 503;
        }
        if (-e /run/agent-os/hub-maintenance-hard) {
            return 503;
        }
        if (-e /run/agent-os/hub-maintenance) {
            return 503;
        }
        limit_conn agent_os_conn 10;
        limit_req zone=agent_os_runner burst=30 nodelay;
        proxy_pass http://127.0.0.1:4173;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Origin $http_origin;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 75s;
        proxy_send_timeout 75s;
    }

    location / {
        if (-e /var/lib/agent-os-ops/hub-block) {
            return 503;
        }
        if (-e /run/agent-os/hub-maintenance-hard) {
            return 503;
        }
        if (-e /run/agent-os/hub-maintenance) {
            return 503;
        }
        limit_conn agent_os_conn 20;
        limit_req zone=agent_os_api burst=40 nodelay;
        proxy_pass http://127.0.0.1:4173;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Origin $http_origin;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 75s;
        proxy_send_timeout 75s;
    }
}
